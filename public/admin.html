<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Pedidos de material</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .painel { padding: 2rem 0 4rem; }
    .painel-cabeca { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; margin-bottom: 1.6rem; }
    .painel-cabeca h1 { font-family: var(--fonte-titulo); font-size: 1.8rem; text-transform: uppercase; letter-spacing: .5px; }
    .painel-cabeca .sub { color: var(--tinta-fraca); font-size: .88rem; margin-top: .25rem; }

    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1rem; margin-bottom: 1.6rem; }
    .cartao { background: var(--fundo-2); border: 1px solid var(--linha-fraca); border-radius: var(--raio); padding: 1.2rem 1.3rem; }
    .cartao .n { font-family: var(--fonte-titulo); font-size: 2.1rem; line-height: 1; color: var(--acento-claro); }
    .cartao .r { font-family: var(--fonte-cond); font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-fraca); margin-bottom: .5rem; }
    .cartao .d { font-size: .84rem; color: var(--tinta-fraca); }

    .filtros { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; font-size: .85rem; color: var(--tinta-fraca); }

    .tabela-caixa { background: var(--fundo-2); border: 1px solid var(--linha-fraca); border-radius: var(--raio); overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .86rem; white-space: nowrap; }
    th, td { padding: .75rem .9rem; text-align: left; border-bottom: 1px solid var(--linha-fraca); }
    th {
      position: sticky; top: 0; background: var(--fundo-3);
      font-family: var(--fonte-cond); font-size: .72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-fraca);
    }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--veu-1); }

    .pill {
      display: inline-block; padding: .18rem .6rem; border-radius: 999px;
      font-family: var(--fonte-cond); font-size: .74rem; letter-spacing: .04em;
      text-transform: uppercase; background: var(--veu-2); border: 1px solid var(--linha);
      color: var(--acento-claro);
    }
    /* pedido de perfurado sempre passa por contato antes do envio */
    .pill.alerta { color: var(--acento-tinta); background: var(--acento); border-color: var(--acento); }
    .nota { font-family: var(--fonte-titulo); font-size: 1.05rem; color: var(--acento-claro); }

    select.status {
      font-family: var(--fonte-corpo); font-size: .8rem; padding: .3rem .45rem;
      border: 1px solid var(--linha-fraca); border-radius: 6px;
      background: var(--fundo-3); color: var(--tinta);
    }
    .aviso { background: var(--fundo-2); border: 1px solid var(--linha-fraca); border-radius: var(--raio); padding: 2.5rem; text-align: center; color: var(--tinta-fraca); }
    .aviso h2 { font-family: var(--fonte-titulo); text-transform: uppercase; color: var(--tinta); margin-bottom: .6rem; }
    .aviso code { background: var(--fundo-3); padding: .12rem .4rem; border-radius: 4px; color: var(--acento-claro); }

    /* login */
    .entrada { max-width: 380px; margin: 8vh auto; }
    .entrada h1 { font-family: var(--fonte-titulo); font-size: 1.6rem; text-transform: uppercase; letter-spacing: .5px; text-align: center; }
    .entrada .sub { color: var(--tinta-fraca); font-size: .88rem; text-align: center; margin: .4rem 0 1.6rem; }
    .entrada form { background: var(--fundo-2); border: 1px solid var(--linha-fraca); border-radius: var(--raio); padding: 1.6rem; display: grid; gap: 1rem; }
    .entrada label { display: block; font-family: var(--fonte-cond); font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-fraca); margin-bottom: .4rem; }
    .entrada input {
      width: 100%; padding: .7rem .8rem; font: inherit; color: var(--tinta);
      background: var(--fundo-3); border: 1px solid var(--linha-fraca); border-radius: 8px;
    }
    .entrada input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
    .entrada .erro { color: #ff8f8f; font-size: .85rem; min-height: 1.2em; }
    .quem { color: var(--tinta-fraca); font-size: .82rem; }
  </style>
</head>
<body>
<div class="wrap painel" id="painel" hidden>
  <div class="painel-cabeca">
    <div>
      <h1>Pedidos de material</h1>
      <p class="sub">Ordenado por engajamento — quem rende mais aparece primeiro.</p>
    </div>
    <div style="display:flex;gap:.6rem;align-items:center">
      <span class="quem" id="quem"></span>
      <button class="btn btn-vazado btn-sm" id="recarregar">Atualizar</button>
      <a class="btn btn-primario btn-sm" href="/api/admin/export.csv">Baixar CSV</a>
      <button class="btn btn-vazado btn-sm" id="sair">Sair</button>
    </div>
  </div>

  <div id="conteudo">
    <div class="aviso">Carregando...</div>
  </div>
</div>

<div class="wrap entrada" id="entrada" hidden>
  <h1>Painel de pedidos</h1>
  <p class="sub">Acesso restrito à equipe da campanha.</p>
  <form id="form-entrada">
    <div>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus>
    </div>
    <div>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <p class="erro" id="erro-entrada"></p>
    <button class="btn btn-primario" type="submit" id="botao-entrar">Entrar</button>
  </form>
</div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATUS = ['novo', 'separado', 'enviado', 'entregue', 'cancelado'];
let filtroStatus = '';

// No banco fica o valor cru do formulário; aqui vira algo legível na tabela.
const ROTULOS = {
  ate_1h: 'até 1h', '1_a_3h': '1 a 3h', mais_3h: 'mais de 3h',
  ate_10: 'até 10', '10_a_30': '10 a 30', mais_30: 'mais de 30',
  so_eu: 'só ele(a)', algumas: 'algumas pessoas', varias: 'várias pessoas',
  quero: 'quer', prefiro_outros: 'prefere outros', so_kit: 'só o kit',
  sem_carro: 'não tem', sem_moto: 'não tem', sim: 'sim', nao: 'não',
};
const rot = (v) => ROTULOS[v] ?? (v || '—');

$('#recarregar').addEventListener('click', carregar);
$('#form-entrada').addEventListener('submit', entrar);
$('#sair').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  mostrarEntrada();
});

iniciar();

// --- sessão --------------------------------------------------------------

async function iniciar() {
  const r = await fetch('/api/admin/eu');
  if (!r.ok) return mostrarEntrada();
  const { usuario } = await r.json();
  mostrarPainel(usuario);
}

function mostrarEntrada() {
  $('#painel').hidden = true;
  $('#entrada').hidden = false;
  $('#email').focus();
}

function mostrarPainel(usuario) {
  $('#entrada').hidden = true;
  $('#painel').hidden = false;
  $('#quem').textContent = usuario.nome;
  carregar();
}

async function entrar(evento) {
  evento.preventDefault();
  const botao = $('#botao-entrar');
  botao.disabled = true;
  $('#erro-entrada').textContent = '';

  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('#email').value, senha: $('#senha').value }),
    });
    const dados = await r.json().catch(() => ({}));

    if (!r.ok) {
      $('#erro-entrada').textContent = dados.erro || 'Não foi possível entrar.';
      $('#senha').select();
      return;
    }
    $('#senha').value = '';
    mostrarPainel(dados.usuario);
  } catch {
    $('#erro-entrada').textContent = 'Sem conexão com o servidor.';
  } finally {
    botao.disabled = false;
  }
}

// --- dados ---------------------------------------------------------------

async function carregar() {
  const r = await fetch('/api/admin/pedidos' + (filtroStatus ? `?status=${filtroStatus}` : ''));

  // A sessão dura 12h; quando vence, cai de volta na tela de login.
  if (r.status === 401) return mostrarEntrada();

  if (!r.ok) {
    const { erro } = await r.json().catch(() => ({}));
    $('#conteudo').innerHTML = `<div class="aviso"><h2>Não deu para carregar</h2>
      <p>${esc(erro || 'Erro no servidor.')}</p></div>`;
    return;
  }

  const { resumo, pedidos } = await r.json();
  render(resumo, pedidos);
}

function render(resumo, pedidos) {
  const topoKit = resumo.porKit.map(k => `${k.kit}: ${k.n}`).join(' · ') || '—';
  const topoUf = resumo.porUf.slice(0, 4).map(u => `${u.uf}: ${u.n}`).join(' · ') || '—';

  $('#conteudo').innerHTML = `
    <div class="cartoes">
      <div class="cartao"><div class="r">Pedidos</div><div class="n">${resumo.total}</div></div>
      <div class="cartao"><div class="r">Adesivos carro</div><div class="n">${resumo.adesivos.carros}</div></div>
      <div class="cartao"><div class="r">Adesivos moto</div><div class="n">${resumo.adesivos.motos}</div></div>
      <div class="cartao"><div class="r">Por kit</div><div class="d">${esc(topoKit)}</div></div>
      <div class="cartao"><div class="r">Top estados</div><div class="d">${esc(topoUf)}</div></div>
    </div>

    <div class="filtros">
      <label>Status:
        <select class="status" id="filtro">
          <option value="">todos</option>
          ${STATUS.map(s => `<option value="${s}" ${s === filtroStatus ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </label>
      <span style="color:var(--tinta-suave);font-size:.85rem">${pedidos.length} exibidos · a tabela rola para o lado</span>
    </div>

    <div class="tabela-caixa">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Nota</th><th>Data</th><th>Status</th>
            <th>Nome</th><th>WhatsApp</th><th>E-mail</th>
            <th>CEP</th><th>Cidade/UF</th><th>Bairro</th><th>Endereço</th><th>Nº</th><th>Compl.</th>
            <th>Carro</th><th>Moto</th><th>Contato</th>
            <th>Kit</th><th>Kit sugerido</th>
            <th>Tempo</th><th>Alcance</th><th>Distribui</th><th>Condomínio</th><th>Unidades</th>
            <th>LGPD</th>
          </tr>
        </thead>
        <tbody>
          ${pedidos.map(linha).join('')
            || '<tr><td colspan="24" style="text-align:center;padding:2rem;color:var(--tinta-suave)">Nenhum pedido ainda.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  $('#filtro').addEventListener('change', (e) => { filtroStatus = e.target.value; carregar(); });
  document.querySelectorAll('[data-status-id]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const r = await fetch('/api/admin/status', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: Number(sel.dataset.statusId), status: sel.value }),
      });
      if (r.status === 401) return mostrarEntrada();
      carregar();
    });
  });
}

function linha(p) {
  return `<tr>
    <td>${p.id}</td>
    <td class="nota">${p.engajamento}</td>
    <td>${esc((p.criado_em || '').slice(0, 16).replace('T', ' '))}</td>
    <td>
      <select class="status" data-status-id="${p.id}">
        ${STATUS.map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </td>
    <td>${esc(p.nome)}</td>
    <td>${esc(p.whatsapp)}</td>
    <td>${esc(p.email)}</td>
    <td>${esc(p.cep)}</td>
    <td>${esc(p.cidade)}/${esc(p.uf)}</td>
    <td>${esc(p.bairro || '—')}</td>
    <td>${esc(p.endereco)}</td>
    <td>${esc(p.numero)}</td>
    <td>${esc(p.complemento || '—')}</td>
    <td>${esc(rot(p.adesivo_carro))}${p.adesivo_carro === 'quero' ? ` (${p.qtd_carros})` : ''}</td>
    <td>${esc(rot(p.adesivo_moto))}${p.adesivo_moto === 'quero' ? ` (${p.qtd_motos})` : ''}</td>
    <td>${p.adesivo_carro === 'quero' ? '<span class="pill alerta">necessita contato</span>' : '—'}</td>
    <td><span class="pill">${esc(p.kit)}</span></td>
    <td>${esc(p.kit_recomendado)}</td>
    <td>${esc(rot(p.disponibilidade))}</td>
    <td>${esc(rot(p.contatos))}</td>
    <td>${esc(rot(p.distribuidores))}</td>
    <td>${esc(rot(p.mora_condominio))}</td>
    <td>${p.unidades_condominio ?? '—'}</td>
    <td>${p.aceite_lgpd ? 'sim' : 'não'}</td>
  </tr>`;
}
</script>
</body>
</html>
